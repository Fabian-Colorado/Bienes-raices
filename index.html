<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inmobiliaria</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Inmobiliaria</h1>
        <p>Encuentra tu próxima casa</p>
    </header>

    <main>
        <section id="properties">
            <h2>Propiedades disponibles</h2>

            <div id="property-list">
                <!-- Las casas aparecerán aquí -->
            </div>
        </section>
    </main>

    <!-- Contacto para propietarios -->
    <div class="owner-contact">

        <button
            id="owner-contact-button"
            class="owner-contact-button"
            type="button"
        >
            🏠 ¿Te interesa vender una propiedad?
        </button>

        <div
            id="owner-contact-menu"
            class="owner-contact-menu"
        >
            <p class="owner-contact-title">
                ¿Te interesa vender una propiedad?
            </p>

            <p class="owner-contact-text">
                Podemos ayudarte a ponerla en venta.
            </p>

            <button
                id="owner-whatsapp-button"
                class="owner-whatsapp-button"
                type="button"
            >
                💬 Contactar por WhatsApp
            </button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
